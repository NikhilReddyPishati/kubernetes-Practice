apiVersion : v1
kind : Pod

metadata :
  name : secret-demo

spec :
  containers :
  - name : nginx
    image : nginx
    
    env :
    - name : USERNAME
      valueFrom :
        secretKeyRef :
          name : app-secret
          key : USERNAME
    - name : PASSWORD
      valueFrom :
        secretKeyRef :
          name : app-secret
          key : PASSWORD